<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="day">

<div class="bg-layer" id="bgLayer"></div>

<main class="wrap">
  <div class="top-bar">
    <span class="greeting" id="greeting">Hello</span>
    <div class="controls">
      <button type="button" class="pill-btn" id="formatToggle" aria-pressed="false">24h</button>
      <button type="button" class="icon-btn" id="fullscreenToggle" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="clock" id="clock" role="timer" aria-live="off">
    <div class="digit-group" id="group-h"></div>
    <div class="colon" id="colon1">:</div>
    <div class="digit-group" id="group-m"></div>
    <div class="colon" id="colon2">:</div>
    <div class="digit-group" id="group-s"></div>
    <span class="meridiem" id="meridiem">PM</span>
  </div>

  <p class="sr-only" id="srTime" aria-live="polite"></p>
  <p class="date-line" id="dateLine">—</p>

  <div class="world-clock" id="worldClock"></div>
</main>

<script src="script.js"></script>
</body>
</html>
